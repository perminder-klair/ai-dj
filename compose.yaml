services:
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - controller
    environment:
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD}
      CONTROLLER_URL: http://controller:8787
      STREAM_URL: http://icecast:8000/live.mp3
    ports:
      - "${WEB_PORT:-3000}:3000"
  controller:
    image: node:26-bookworm-slim
    restart: unless-stopped
    user: "${VENUE_UID:?Set VENUE_UID}:${VENUE_GID:?Set VENUE_GID}"
    working_dir: /app
    environment:
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    ports:
      - "127.0.0.1:${CONTROLLER_PORT:-8787}:8787"
    volumes:
      - ./controller:/app/controller:ro
      - ${STATE_DIR:?Set STATE_DIR}:/state
    command: ["node", "/app/controller/serve.ts", "/state"]
  icecast:
    build: ./audio/icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?Set ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?Set ICECAST_ADMIN_PASSWORD}
    ports:
      - "${ICECAST_PORT:-8000}:8000"
  liquidsoap:
    image: savonet/liquidsoap:v2.4.5
    restart: unless-stopped
    user: "${VENUE_UID:?Set VENUE_UID}:${VENUE_GID:?Set VENUE_GID}"
    depends_on:
      - icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?Set ICECAST_SOURCE_PASSWORD}
      HOME: /tmp
    volumes:
      - ${MUSIC_DIR:?Set MUSIC_DIR}:/music:ro
      - ${STATE_DIR:?Set STATE_DIR}:/state
      - ./audio/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ./audio/filter-schedule.sh:/etc/liquidsoap/filter-schedule.sh:ro
    command: ["/etc/liquidsoap/radio.liq"]
